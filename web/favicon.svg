<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#2363ce"/>
  <!-- Gauge arc background -->
  <path d="M5 20 A11 11 0 0 1 27 20" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
  <!-- Tick marks -->
  <g stroke="#fff" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <line x1="5" y1="20" x2="7" y2="20"/>
    <line x1="7" y1="13" x2="8.5" y2="14.5"/>
    <line x1="16" y1="9" x2="16" y2="11"/>
    <line x1="25" y1="13" x2="23.5" y2="14.5"/>
    <line x1="27" y1="20" x2="25" y2="20"/>
  </g>
  <!-- Speed needle -->
  <g transform="rotate(40 16 20)">
    <line x1="16" y1="20" x2="16" y2="10" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <circle cx="16" cy="20" r="2" fill="#fff"/>
</svg>
